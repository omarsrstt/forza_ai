[project]
name = "forza"
version = "0.1.0"
description = "Automating driving in Forza Horizon using behavioural cloning"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "lightning>=2.2",
    "torchmetrics>=1.4",
    "wandb>=0.17",
    "natsort>=8.4",
    "pillow>=10.2",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "mss>=9.0",
    "pygame>=2.5",
    "keyboard>=0.13",
    "vgamepad>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# Modules live flat at the repo root; make them importable from tests/.
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
